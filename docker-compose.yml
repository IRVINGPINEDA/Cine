services:
  db:
    image: postgres:16-alpine
    container_name: cine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cine_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cine_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cine-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-cine_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Issuer: ${JWT_ISSUER:-Cine.Web}
      Jwt__Audience: ${JWT_AUDIENCE:-Cine.Mobile}
      Jwt__SecretKey: ${JWT_SECRET_KEY:-CHANGE_THIS_SUPER_SECRET_KEY_32CHARS_MIN_12345}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-120}
      Seeding__SeedDemoData: ${SEED_DEMO_DATA:-false}
      Seeding__BootstrapAdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Seeding__BootstrapAdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/wwwroot/uploads

  caddy:
    image: caddy:2-alpine
    container_name: cine-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
